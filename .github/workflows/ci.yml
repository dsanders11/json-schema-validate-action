name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Check Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest
    needs: test-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Local Action (Single File Valid)
        id: single-file-valid
        uses: $/
        with:
          schema: https://json.schemastore.org/github-workflow.json
          files: .github/workflows/ci.yml
      - name: Test Local Action (Single File Not Valid)
        id: single-file-not-valid
        uses: $/
        with:
          # Use the wrong schema so it fails validation
          schema: https://gist.githubusercontent.com/dsanders11/b17fd12c00fc44b487df66d61039398e/raw/f05a9c19d6662282b1576b268e5c3228befc4700/schema.json
          files: .github/workflows/ci.yml
          fail-on-invalid: false
          all-errors: true
      - name: Test Local Action (Multiple File Valid)
        id: multiple-file-valid
        uses: $/
        with:
          schema: https://json.schemastore.org/github-workflow.json
          files: .github/workflows/**.yml
      - name: Test Local Action (Multiple File Not Valid)
        id: multiple-file-not-valid
        uses: $/
        with:
          # Use the wrong schema so it fails validation
          schema: https://gist.githubusercontent.com/dsanders11/b17fd12c00fc44b487df66d61039398e/raw/f05a9c19d6662282b1576b268e5c3228befc4700/schema.json
          files: .github/workflows/**.yml
          fail-on-invalid: false
          all-errors: true
      - name: Test Local Action (Additional Schemas Valid)
        id: additional-schemas-valid
        uses: $/
        with:
          schema: ./__tests__/fixtures/composite.schema.json
          files: ./__tests__/fixtures/composite-config.yml
          additional-schemas: |
            ./__tests__/fixtures/evm-config.schema.json
            https://json.schemastore.org/github-workflow.json
      - name: Test Local Action (Invalid Schema)
        id: invalid-schema
        uses: $/
        with:
          schema: json-schema
          files: ./__tests__/fixtures/invalid.schema.json
          fail-on-invalid: false
      - name: Confirm Output
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SINGLE_FILE_VALID: ${{ steps.single-file-valid.outputs.valid }}
          SINGLE_FILE_NOT_VALID: ${{ steps.single-file-not-valid.outputs.valid }}
          MULTIPLE_FILE_VALID: ${{ steps.multiple-file-valid.outputs.valid }}
          MULTIPLE_FILE_NOT_VALID: ${{ steps.multiple-file-not-valid.outputs.valid }}
          ADDITIONAL_SCHEMAS_VALID: ${{ steps.additional-schemas-valid.outputs.valid }}
          INVALID_SCHEMA: ${{ steps.invalid-schema.outputs.valid }}
        with:
          script: |
            const assert = require('node:assert');

            assert.strictEqual(process.env.SINGLE_FILE_VALID, 'true', 'Expected output for single file valid to be true');
            assert.strictEqual(process.env.SINGLE_FILE_NOT_VALID, 'false', 'Expected output for single file invalid to be false');
            assert.strictEqual(process.env.MULTIPLE_FILE_VALID, 'true', 'Expected output for multiple file valid to be true');
            assert.strictEqual(process.env.MULTIPLE_FILE_NOT_VALID, 'false', 'Expected output for multiple file invalid to be false');
            assert.strictEqual(process.env.ADDITIONAL_SCHEMAS_VALID, 'true', 'Expected output for additional schemas valid to be true');
            assert.strictEqual(process.env.INVALID_SCHEMA, 'false', 'Expected output for invalid schema to be false');

  confirm-annotations:
    name: Confirm Annotations
    runs-on: ubuntu-latest
    needs: test-action
    permissions:
      actions: read
      checks: read
    steps:
      - name: Check Error Annotations
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const assert = require('node:assert');

            const {
              data: { jobs }
            } = await github.rest.actions.listJobsForWorkflowRunAttempt({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT)
            });

            const testJob = jobs.find(
              job => job.name === 'GitHub Actions Test'
            );
            assert.ok(testJob, 'Expected to find GitHub Actions Test job');

            const annotations = await github.paginate(
              github.rest.checks.listAnnotations,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: testJob.id
              }
            );

            const errorAnnotations = annotations.filter(
              a => a.title === 'JSON Schema Validation Error'
            );

            const positionOf = a => ({
              start_line: a.start_line,
              end_line: a.end_line,
              start_column: a.start_column,
              end_column: a.end_column
            });

            // Single-line nested value ("foo" in invalid.schema.json)
            const nestedValue = errorAnnotations.find(
              a => a.path === '__tests__/fixtures/invalid.schema.json'
            );
            assert.ok(
              nestedValue,
              'Expected annotation on invalid.schema.json'
            );
            assert.deepStrictEqual(positionOf(nestedValue), {
              start_line: 8,
              end_line: 8,
              start_column: 20,
              end_column: 25
            });

            // Single-line additionalProperties key ("name" in ci.yml)
            const additionalProp = errorAnnotations.find(
              a =>
                a.path === '.github/workflows/ci.yml' &&
                JSON.parse(a.message).keyword === 'additionalProperties'
            );
            assert.ok(
              additionalProp,
              'Expected additionalProperties annotation on ci.yml'
            );
            assert.deepStrictEqual(positionOf(additionalProp), {
              start_line: 1,
              end_line: 1,
              start_column: 1,
              end_column: 5
            });

            // Multi-line root object in ci.yml (lines only, no columns)
            const multiLine = errorAnnotations.find(
              a =>
                a.path === '.github/workflows/ci.yml' &&
                JSON.parse(a.message).keyword === 'required'
            );
            assert.ok(multiLine, 'Expected required annotation on ci.yml');
            assert.strictEqual(multiLine.start_line, 1);
            assert.ok(
              multiLine.end_line > 1,
              'Expected multi-line annotation end_line > 1'
            );
            assert.strictEqual(multiLine.start_column, null);
            assert.strictEqual(multiLine.end_column, null);

  release:
    name: release
    runs-on: ubuntu-latest
    needs: confirm-annotations
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run semantic release
        uses: electron/semantic-trusted-release@672a62fe17fce21a0d10de5a6825ee54817af317 # v1.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
